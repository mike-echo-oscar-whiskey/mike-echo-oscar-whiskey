<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1494" width="880" height="1494" role="img" aria-labelledby="t d">
<title id="t">KRIS(1) — Kris Kater</title>
<desc id="d">KRIS(1), General Commands Manual. Kris Kater: backend engineer, Amsterdam, C# and .NET. Synopsis: kris [--backend] [--linux] [--generative-ai]. NAME: kris — backend engineer in Amsterdam. C# and .NET, backend architecture, and generative AI put to real work. DESCRIPTION: I build backends: APIs with clean boundaries, and more and more LLM integration, agents, retrieval and document processing. I like systems that are simple enough to reason about and honest enough to say when they are broken. OPTIONS: --test-first: A failing test first, then the code that makes it pass. --fail-loudly: No magic fallbacks. When something is wrong, it fails where you can see it, and says what is wrong. --dont-know-yet: An honest "I don't know yet" beats a confident guess. Measure first, then say it. --no-new-debt: Whatever a change made worse, that change fixes. Later is not a plan. --agent-first: "IDEs are to software development what manual transmission is to driving. Powerful, precise, and once essential, but increasingly replaced by systems that operate at a higher level of intent." BUILDING: Wondervonk — a SaaS that helps small and medium-sized businesses get the benefits of generative AI. ENVIRONMENT: Linux is home. My daily system is Omarchy, an opinionated Arch-based Linux on Hyprland. I live in the terminal and never quite stop tuning my setup. I'm a hacker in the original sense: when something behaves oddly, I take it apart until I understand it, and send the fix upstream. Away from the keyboard, I practise handstands and yoga, and I love hiking in the mountains with my girlfriend. PATCHES: omacom/omarchy#12231 — local audio outputs are listed before network ones. spotweb/spotweb#1001 — search terms in non-Latin scripts were silently dropped; now they match (merged). spotweb/spotweb#1000 — a Newznab category for UHD movie spots (merged). SEE ALSO: LinkedIn · wondervonk.ai</desc>
