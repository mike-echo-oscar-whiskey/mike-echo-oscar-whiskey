<g class="l" style="animation-delay:3.67s;animation-timing-function:steps(13,jump-none)"><text class="h" x="119.2" y="504">--test-first</text><text x="292.0" y="504">A failing test first, then the code that makes it pass.</text></g>
<g class="l" style="animation-delay:3.85s;animation-timing-function:steps(14,jump-none)"><text class="h" x="119.2" y="548">--fail-loudly</text><text x="292.0" y="548">No magic fallbacks. When something is wrong, it fails</text></g>
<text class="l" style="animation-delay:4.02s;animation-timing-function:steps(41,jump-none)" x="292.0" y="570">where you can see it, and says what is wrong.</text>
<g class="l" style="animation-delay:4.20s;animation-timing-function:steps(16,jump-none)"><text class="h" x="119.2" y="614">--dont-know-yet</text><text x="292.0" y="614">An honest "I don't know yet" beats a confident guess.</text></g>
<text class="l" style="animation-delay:4.38s;animation-timing-function:steps(28,jump-none)" x="292.0" y="636">Measure first, then say it.</text>
<g class="l" style="animation-delay:4.55s;animation-timing-function:steps(14,jump-none)"><text class="h" x="119.2" y="680">--no-new-debt</text><text x="292.0" y="680">Whatever a change made worse, that change fixes. Later</text></g>
<text class="l" style="animation-delay:4.73s;animation-timing-function:steps(15,jump-none)" x="292.0" y="702">is not a plan.</text>
<g class="l" style="animation-delay:4.91s;animation-timing-function:steps(14,jump-none)"><text class="h" x="119.2" y="746">--agent-first</text><text x="292.0" y="746">"IDEs are to software development what manual</text></g>
<text class="l" style="animation-delay:5.08s;animation-timing-function:steps(41,jump-none)" x="292.0" y="768">transmission is to driving. Powerful, precise, and once</text>
<text class="l" style="animation-delay:5.26s;animation-timing-function:steps(41,jump-none)" x="292.0" y="790">essential, but increasingly replaced by systems that</text>
<text class="l" style="animation-delay:5.44s;animation-timing-function:steps(38,jump-none)" x="292.0" y="812">operate at a higher level of intent."</text>
<text class="l h" style="animation-delay:5.61s;animation-timing-function:steps(9,jump-none)" x="52" y="856">BUILDING</text>
<text class="l" style="animation-delay:5.79s;animation-timing-function:steps(41,jump-none)" x="119.2" y="878"><tspan class="u">Wondervonk</tspan> — a SaaS that helps small and medium-sized businesses get the</text>
<rect class="cur" x="52" y="50" width="9.6" height="18"/>
</g>
