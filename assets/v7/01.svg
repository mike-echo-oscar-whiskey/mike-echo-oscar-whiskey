<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 861" width="880" height="861" role="img" aria-label="KRIS(1), General Commands Manual, KRIS(1). Kris Kater backend engineer · amsterdam · c# / .net SYNOPSIS kris [--backend] [--linux] [--generative-ai] NAME kris — backend engineer in Amsterdam. C# and .NET, backend architecture, and generative AI put to real work. DESCRIPTION I build backends: APIs with clean boundaries, and more and more LLM integration, agents, retrieval and document processing. I like systems that are simple enough to reason about and honest enough to say when they are broken. OPTIONS --test-first: A failing test first, then the code that makes it pass. --fail-loudly: No magic fallbacks. When something is wrong, it fails where you can see it, and says what is wrong. --dont-know-yet: An honest &quot;I don't know yet&quot; beats a confident guess. Measure first, then say it. --no-new-debt: Whatever a change made worse, that change fixes. Later is not a plan. --agent-first: &quot;IDEs are to software development what manual transmission is to driving. Powerful, precise, and once essential, but increasingly replaced by systems that operate at a higher level of intent.&quot; BUILDING">
<defs>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" fill-opacity=".24"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000a03" stop-opacity=".6"/></radialGradient>
<radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#06160a"/><stop offset="100%" stop-color="#020803"/></radialGradient>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="-20" width="880" height="901"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
