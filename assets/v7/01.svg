<text class="l" style="animation-delay:1.91s;animation-timing-function:steps(41,jump-none)" x="119.2" y="218"><tspan class="h">kris</tspan> [<tspan class="u">--backend</tspan>] [<tspan class="u">--linux</tspan>] [<tspan class="u">--generative-ai</tspan>]</text>
<text class="l h" style="animation-delay:2.08s;animation-timing-function:steps(5,jump-none)" x="52" y="262">NAME</text>
