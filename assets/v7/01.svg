<text class="l" style="animation-delay:2.44s;animation-timing-function:steps(36,jump-none)" x="119.2" y="306">and generative AI put to real work.</text>
<text class="l h" style="animation-delay:2.61s;animation-timing-function:steps(12,jump-none)" x="52" y="350">DESCRIPTION</text>
<text class="l" style="animation-delay:2.79s;animation-timing-function:steps(41,jump-none)" x="119.2" y="372">I build backends: APIs with clean boundaries, and more and more LLM</text>
<text class="l" style="animation-delay:2.96s;animation-timing-function:steps(41,jump-none)" x="119.2" y="394">integration, agents, retrieval and document processing. I like systems</text>
