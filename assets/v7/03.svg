<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 906 880 45" width="880" height="45" role="img" aria-label="ENVIRONMENT">
<defs>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" fill-opacity=".24"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000a03" stop-opacity=".6"/></radialGradient>
<radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#06160a"/><stop offset="100%" stop-color="#020803"/></radialGradient>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="886" width="880" height="85"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:16px;fill:#41ff6e;white-space:pre}
.h{fill:#b6ffc8;font-weight:700} .m{fill:#1f9e46} .u{fill:#7dffa0;text-decoration:underline}
.m text{fill:#1f9e46} .big{font-size:34px}
.l{opacity:0;animation-name:type;animation-duration:0.14s;animation-fill-mode:forwards}
@keyframes type{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
.cur{fill:#41ff6e;animation:blink 1s steps(1) infinite,follow 10.80s step-end forwards}
@keyframes blink{50%{opacity:0}}
@keyframes follow{0%{transform:translate(0,0)}12.42%{transform:translate(0,22px)}14.05%{transform:translate(0,88px)}15.69%{transform:translate(0,110px)}17.32%{transform:translate(0,154px)}18.95%{transform:translate(0,176px)}20.59%{transform:translate(0,220px)}22.22%{transform:translate(0,242px)}23.86%{transform:translate(0,264px)}25.49%{transform:translate(0,308px)}27.12%{transform:translate(0,330px)}28.76%{transform:translate(0,352px)}30.39%{transform:translate(0,374px)}32.03%{transform:translate(0,396px)}33.66%{transform:translate(0,440px)}35.29%{transform:translate(0,462px)}36.93%{transform:translate(0,506px)}38.56%{transform:translate(0,528px)}40.20%{transform:translate(0,572px)}41.83%{transform:translate(0,594px)}43.46%{transform:translate(0,638px)}45.10%{transform:translate(0,660px)}46.73%{transform:translate(0,704px)}48.37%{transform:translate(0,726px)}50.00%{transform:translate(0,748px)}51.63%{transform:translate(0,770px)}53.27%{transform:translate(0,814px)}54.90%{transform:translate(0,836px)}56.54%{transform:translate(0,858px)}58.17%{transform:translate(0,902px)}59.80%{transform:translate(0,924px)}61.44%{transform:translate(0,946px)}63.07%{transform:translate(0,968px)}64.71%{transform:translate(0,1012px)}66.34%{transform:translate(0,1034px)}67.97%{transform:translate(0,1078px)}69.61%{transform:translate(0,1100px)}71.24%{transform:translate(0,1144px)}72.88%{transform:translate(0,1166px)}74.51%{transform:translate(0,1188px)}76.14%{transform:translate(0,1210px)}77.78%{transform:translate(0,1232px)}79.41%{transform:translate(0,1254px)}81.05%{transform:translate(0,1276px)}82.68%{transform:translate(0,1298px)}84.31%{transform:translate(0,1342px)}85.95%{transform:translate(0,1364px)}87.58%{transform:translate(0,1386px)}89.22%{transform:translate(0,1430px)}90.85%{transform:translate(0,1452px)}92.48%{transform:translate(0,1474px)}94.12%{transform:translate(0,1496px)}100%{transform:translate(0,1518px)}}
.flk{animation:flicker 4s steps(1) infinite}
@keyframes flicker{0%{opacity:.035}33%{opacity:0}61%{opacity:.05}79%{opacity:.01}}
@media (prefers-reduced-motion:reduce){
.l{opacity:1;animation:none} .flk{animation:none;opacity:0}
.cur{animation:none;transform:translate(0,1518px)}
}
</style>
<rect width="880" height="1626" rx="22" fill="#121a14"/>
<rect x="12" y="12" width="856" height="1602" rx="16" fill="url(#bg)" stroke="#1c2e21" stroke-width="2"/>
<g filter="url(#glow)">
<text class="l" style="animation-delay:5.96s;animation-timing-function:steps(27,jump-none)" x="119.2" y="900">benefits of generative AI.</text>
<text class="l h" style="animation-delay:6.14s;animation-timing-function:steps(12,jump-none)" x="52" y="944">ENVIRONMENT</text>
<text class="l" style="animation-delay:6.32s;animation-timing-function:steps(41,jump-none)" x="119.2" y="966">Linux is home. My daily system is <tspan class="u">Omarchy</tspan>, an opinionated Arch-based</text>
<rect class="cur" x="52" y="50" width="9.6" height="18"/>
</g>
<rect x="12" y="12" width="856" height="1602" rx="16" fill="url(#scan)"/>
<rect class="flk" x="12" y="12" width="856" height="1602" rx="16" fill="#41ff6e" opacity="0"/>
<rect x="12" y="12" width="856" height="1602" rx="16" fill="url(#vig)"/>
</svg>
