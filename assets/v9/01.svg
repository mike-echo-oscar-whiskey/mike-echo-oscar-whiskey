<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 861" width="880" height="861" role="img" aria-label="A terminal runs ssh kris@wondervonk.ai, connects, answers whoami with kris, and opens man kris. KRIS(1), General Commands Manual, KRIS(1). Kris Kater backend engineer · amsterdam · c# / .net SYNOPSIS kris [--backend] [--linux] [--generative-ai] NAME kris — backend engineer in Amsterdam. C# and .NET, backend architecture, and generative AI put to real work. DESCRIPTION I build backends: APIs with clean boundaries, and more and more LLM integration, agents, retrieval and document processing. I like systems that are simple enough to reason about and honest enough to say when they are broken. OPTIONS --test-first: A failing test first, then the code that makes it pass. --fail-loudly: No magic fallbacks. When something is wrong, it fails where you can see it, and says what is wrong. --dont-know-yet: An honest &quot;I don't know yet&quot; beats a confident guess. Measure first, then say it. --no-new-debt: Whatever a change made worse, that change fixes. Later is not a plan. --agent-first: &quot;IDEs are to software development what manual transmission is to driving. Powerful, precise, and once essential, but increasingly replaced by systems that operate at a higher level of intent.&quot; BUILDING">
