<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1017 880 21" width="880" height="21" role="img" aria-label="Linux is home. My daily system is Omarchy, an opinionated Arch-based">
<defs>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" fill-opacity=".24"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000a03" stop-opacity=".6"/></radialGradient>
<radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#06160a"/><stop offset="100%" stop-color="#020803"/></radialGradient>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="997" width="880" height="61"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:16px;fill:#41ff6e;white-space:pre}
.h{fill:#b6ffc8;font-weight:700} .m{fill:#1f9e46} .u{fill:#7dffa0;text-decoration:underline}
.b{fill:#b6ffc8} .m text{fill:#1f9e46} .big{font-size:34px}
.l{opacity:0;animation-name:type;animation-duration:0.14s;animation-fill-mode:forwards}
@keyframes type{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
.cur{fill:#41ff6e;animation:blink 1s steps(1) infinite,follow 11.15s step-end forwards}
@keyframes blink{50%{opacity:0}}
@keyframes follow{0%{transform:translate(0,0)}12.03%{transform:translate(0,22px)}13.61%{transform:translate(0,44px)}15.19%{transform:translate(0,88px)}16.77%{transform:translate(0,154px)}18.35%{transform:translate(0,176px)}19.94%{transform:translate(0,220px)}21.52%{transform:translate(0,242px)}23.10%{transform:translate(0,286px)}24.68%{transform:translate(0,308px)}26.27%{transform:translate(0,330px)}27.85%{transform:translate(0,374px)}29.43%{transform:translate(0,396px)}31.01%{transform:translate(0,418px)}32.59%{transform:translate(0,440px)}34.18%{transform:translate(0,462px)}35.76%{transform:translate(0,506px)}37.34%{transform:translate(0,528px)}38.92%{transform:translate(0,572px)}40.51%{transform:translate(0,594px)}42.09%{transform:translate(0,638px)}43.67%{transform:translate(0,660px)}45.25%{transform:translate(0,704px)}46.84%{transform:translate(0,726px)}48.42%{transform:translate(0,770px)}50.00%{transform:translate(0,792px)}51.58%{transform:translate(0,814px)}53.16%{transform:translate(0,836px)}54.75%{transform:translate(0,880px)}56.33%{transform:translate(0,902px)}57.91%{transform:translate(0,924px)}59.49%{transform:translate(0,968px)}61.08%{transform:translate(0,990px)}62.66%{transform:translate(0,1012px)}64.24%{transform:translate(0,1034px)}65.82%{transform:translate(0,1078px)}67.41%{transform:translate(0,1100px)}68.99%{transform:translate(0,1144px)}70.57%{transform:translate(0,1166px)}72.15%{transform:translate(0,1210px)}73.73%{transform:translate(0,1232px)}75.32%{transform:translate(0,1254px)}76.90%{transform:translate(0,1276px)}78.48%{transform:translate(0,1298px)}80.06%{transform:translate(0,1320px)}81.65%{transform:translate(0,1342px)}83.23%{transform:translate(0,1364px)}84.81%{transform:translate(0,1408px)}86.39%{transform:translate(0,1430px)}87.97%{transform:translate(0,1452px)}89.56%{transform:translate(0,1496px)}91.14%{transform:translate(0,1518px)}92.72%{transform:translate(0,1540px)}94.30%{transform:translate(0,1562px)}100%{transform:translate(0,1584px)}}
.flk{animation:flicker 4s steps(1) infinite}
@keyframes flicker{0%{opacity:.035}33%{opacity:0}61%{opacity:.05}79%{opacity:.01}}
@media (prefers-reduced-motion:reduce){
.l{opacity:1;animation:none} .flk{animation:none;opacity:0}
.cur{animation:none;transform:translate(0,1584px)}
}
</style>
<rect width="880" height="1692" rx="22" fill="#121a14"/>
<rect x="12" y="12" width="856" height="1668" rx="16" fill="url(#bg)" stroke="#1c2e21" stroke-width="2"/>
<g filter="url(#glow)">
<text class="l h" style="animation-delay:6.49s;animation-timing-function:steps(12,jump-none)" x="52" y="1010">ENVIRONMENT</text>
<text class="l" style="animation-delay:6.67s;animation-timing-function:steps(41,jump-none)" x="119.2" y="1032">Linux is home. My daily system is <tspan class="u">Omarchy</tspan>, an opinionated Arch-based</text>
<text class="l" style="animation-delay:6.85s;animation-timing-function:steps(41,jump-none)" x="119.2" y="1054">Linux on Hyprland. I live in the terminal and never quite stop tuning my</text>
<rect class="cur" x="52" y="50" width="9.6" height="18"/>
</g>
<rect x="12" y="12" width="856" height="1668" rx="16" fill="url(#scan)"/>
<rect class="flk" x="12" y="12" width="856" height="1668" rx="16" fill="#41ff6e" opacity="0"/>
<rect x="12" y="12" width="856" height="1668" rx="16" fill="url(#vig)"/>
</svg>
