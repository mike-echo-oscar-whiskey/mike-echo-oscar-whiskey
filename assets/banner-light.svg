  <text x="652" y="122"><tspan class="accent" font-weight="700">E</tspan><tspan class="muted">cho</tspan></text>
  <text x="652" y="152"><tspan class="accent" font-weight="700">O</tspan><tspan class="muted">scar</tspan></text>
  <text x="652" y="182"><tspan class="accent" font-weight="700">W</tspan><tspan class="muted">hiskey</tspan></text>
