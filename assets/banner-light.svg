<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="t d">
<title id="t">KRIS(1)</title>
<desc id="d">Kris Kater, backend engineer in Amsterdam. Mike, Echo, Oscar, Whiskey: the handle spells MEOW.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.fg{fill:#1f2328} .muted{fill:#59636e} .accent{fill:#bc4c00}
.cursor{fill:#bc4c00;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
<rect x="0.5" y="0.5" width="879" height="239" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<g class="mono muted" font-size="13">
  <text x="28" y="36">KRIS(1)</text>
  <text x="440" y="36" text-anchor="middle">General Commands Manual</text>
  <text x="852" y="36" text-anchor="end">KRIS(1)</text>
</g>
<line x1="28" y1="52" x2="852" y2="52" stroke="#d8dee4"/>
<text class="sans fg" x="28" y="122" font-size="52" font-weight="700">Kris Kater</text>
<text class="mono muted" x="30" y="160" font-size="15">backend engineer · amsterdam · c# / .net</text>
<text class="mono fg" x="30" y="206" font-size="16" textLength="200" lengthAdjust="spacingAndGlyphs"><tspan class="accent">$</tspan> kris --fail-loudly</text>
<rect class="cursor" x="236" y="192" width="9" height="18"/>
